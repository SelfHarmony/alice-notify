[project]
name = "alice-notify"
version = "0.1.0"
description = "Бридж для умного дома с Алисой через неофициальный quasar API (TTS, напоминания, сценарии)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "qrcode>=7.4",
]

[project.optional-dependencies]
# Стадия 6 — FastAPI
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
# Стадия 7 — MCP-сервер (API mcp.server.fastmcp — линия 1.x; в 2.0 модуль перемещён)
mcp = [
    "mcp>=1.2,<2",
]
# Гео-поиск с рейтингами через headless-браузер
geo = [
    "playwright>=1.40",
]
# Всё сразу
all = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "mcp>=1.2,<2",
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alice_notify"]
